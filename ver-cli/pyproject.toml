[project]
name = "ver-cli"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ver",
    "tomlkit>=0.13.2",
]

[build-system]
requires = ["uv_build>=0.9.25,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[project.scripts]
ver = "ver_cli.cli:main"

[tool.uv.sources]
ver = { path = "../ver" }
